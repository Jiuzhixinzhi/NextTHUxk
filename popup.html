<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --ink: #1d1f24;
  --ink-soft: #6b7280;
  --line: rgba(29,31,36,.08);
  --accent: #2f6bff;
}
body {
  width: 280px;
  font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", sans-serif;
  padding: 18px 20px 20px;
  color: var(--ink);
  background: linear-gradient(160deg, #f4f6fa 0%, #eef1f7 55%, #e9edf5 100%);
}
.logo {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--ink);
}
.sub { font-size: 11px; color: var(--ink-soft); margin: 3px 0 14px; letter-spacing: .08em; }
.status {
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 14px;
  padding: 9px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,.5);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(29,31,36,.05), 0 2px 12px rgba(29,31,36,.06);
}
.status.ok { color: #07c160; }
.status.err { color: #ee4d4d; }
.btn {
  display: block;
  width: 100%;
  padding: 11px;
  border-radius: 14px;
  background: rgba(255,255,255,.5);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  color: var(--ink);
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .04em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(29,31,36,.07), 0 6px 24px rgba(29,31,36,.12);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover {
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(29,31,36,.07), 0 10px 30px rgba(29,31,36,.16);
}
.btn:active { transform: translateY(0); }
</style>
</head>
<body>
<div class="logo">NextTHUxk</div>
<div class="sub">下一代选课 · AI 智能辅助</div>
<div id="status" class="status">检测中…</div>
<button class="btn" id="launch">启动选课工作台</button>
<script src="popup.js"></script>
</body>
</html>
