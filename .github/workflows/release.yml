name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 版本一致性守门（tag ↔ manifest；运行时版本由 getManifest 单源读取）
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version manifest.json)
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::版本不一致: tag=v$TAG manifest=$MANIFEST"
            exit 1
          fi

      - name: 类型检查
        run: pnpm check

      - name: 单元测试
        run: pnpm test

      - name: 打包 zip / xpi
        run: |
          pnpm build
          VER="${GITHUB_REF_NAME#v}"
          cd dist
          zip -r "nextthuxk-$VER.zip" . -x "*.map"
          cp "nextthuxk-$VER.zip" "nextthuxk-$VER.xpi"
          cd ..
          mv "dist/nextthuxk-$VER.zip" .
          mv "dist/nextthuxk-$VER.xpi" .

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "nextthuxk-$VER.zip" "nextthuxk-$VER.xpi" \
            --title "NextTHUxk v$VER" \
            --generate-notes \
            --latest
